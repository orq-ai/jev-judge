[project]
name = "jev-judge"
version = "0.1.0"
description = "Judge repeatability on frozen docs-agent runs: Jev vs three LLM judges"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "evaluatorq>=1.39.0",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "matplotlib>=3.9.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "rich>=14.0.0",
    "tenacity>=8.0.0",
    "typer>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_judge"]

[tool.ruff]
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "F", "W", "ANN", "ASYNC", "S", "FBT", "B", "A", "ISC", "LOG", "G", "PIE",
    "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TC", "ARG", "PTH", "I", "N",
    "PERF", "UP", "FURB", "RUF", "TRY",
]
ignore = [
    "ANN001", "ANN201", "ANN202", "ANN401", "ARG001", "ARG002", "B904", "E402",
    "E501", "G004", "Q000", "Q003", "TRY003", "TRY300",
]

[tool.ruff.lint.isort]
known-first-party = ["jev_judge"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "INP001", "SLF001"]
"scripts/*.py" = ["INP001", "T201", "S101"]
